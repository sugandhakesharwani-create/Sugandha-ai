<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2B1B3D">
<title>SUGANDHA AI</title>
<style>
:root{--plum:#2B1B3D;--soft:#4A3566;--bg:#FBF7FF;--line:#E6DDF0;--gold:#F2A900;--rose:#B8185A;--leaf:#1F7A5C;--text:#241632;--muted:#6B5E7B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Noto Sans Devanagari",system-ui,Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;padding-bottom:70px}
[hidden]{display:none!important}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--plum);color:#fff}
.brand{font-weight:700;letter-spacing:.04em}
#quick{background:none;color:#fff;border:1.5px solid var(--gold);border-radius:99px;padding:6px 14px;font:inherit;font-size:.9rem}
main{max-width:640px;margin:0 auto;padding:20px 16px}
h1{font-size:1.5rem;line-height:1.3;margin:4px 0 8px;color:var(--plum)}
h2{font-size:1.1rem;margin:26px 0 10px;color:var(--soft)}
.lead{color:var(--muted);margin:0 0 16px}
.note{border-inline-start:5px solid var(--gold);background:#FFF6DB;padding:12px 14px;border-radius:10px}
.note p{margin:4px 0 0;font-size:.95rem}
.list{display:grid;gap:12px}
.tool{display:flex;gap:14px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.ic{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:1.4rem}
.name{font-weight:700;display:block}
.desc{color:var(--muted);font-size:.92rem;display:block}
.badge{display:inline-block;margin-top:8px;font-size:.78rem;font-weight:600;padding:2px 10px;border-radius:99px;background:#EFE7F7;color:var(--soft)}
label{display:block;font-weight:600;margin:14px 0 6px}
select{width:100%;font:inherit;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:#fff}
.hint{color:var(--muted);font-size:.9rem;margin:8px 0}
nav{position:fixed;inset-inline:0;bottom:0;height:64px;display:flex;background:#fff;border-top:1px solid var(--line)}
nav button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:.82rem}
nav button.on{color:var(--rose);font-weight:700}
</style>
</head>
<body>
<header>
  <span class="brand">SUGANDHA AI</span>
  <button id="quick">EN | हिं</button>
</header>

<main>
  <section id="v-home">
    <h1 data-t="home_title"></h1>
    <p class="lead" data-t="home_lead"></p>
    <div class="note"><strong data-t="note_title"></strong><p data-t="note_text"></p></div>
    <h2 data-t="your_tools"></h2>
    <div class="list" id="l1"></div>
  </section>

  <section id="v-tools" hidden>
    <h1 data-t="nav_tools"></h1>
    <p class="lead" data-t="tools_lead"></p>
    <div class="list" id="l2"></div>
  </section>

  <section id="v-settings" hidden>
    <h1 data-t="nav_settings"></h1>
    <label for="sel" data-t="language"></label>
    <select id="sel">
      <option value="en">English</option>
      <option value="hi">हिन्दी</option>
    </select>
    <p class="hint" data-t="lang_hint"></p>
    <h2 data-t="about"></h2>
    <p class="hint"><span data-t="version"></span> 0.1 (Stage 1)</p>
    <p class="hint" data-t="ai_notice"></p>
  </section>
</main>

<nav>
  <button data-v="home" class="on" data-t="nav_home"></button>
  <button data-v="tools" data-t="nav_tools"></button>
  <button data-v="settings" data-t="nav_settings"></button>
</nav>
